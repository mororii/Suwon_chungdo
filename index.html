<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#1e3a5f">
<title>청도 수원현장 공정 현황</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚧</text></svg>">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f4f7;--card:#fff;--ink:#16202e;--sub:#5d6b7d;--line:#e2e6ec;
      --brand:#1e3a5f;--accent:#0b6ea9;--good:#0f9d58;--bad:#d93025}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:0 12px 40px}

header{position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;
  padding:calc(9px + env(safe-area-inset-top)) 12px 0;box-shadow:0 2px 10px rgba(0,0,0,.18)}
header .inner{max-width:640px;margin:0 auto}
header h1{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.02em}
header .sub{font-size:11.5px;opacity:.72;margin-top:1px}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:80px;border:0;background:transparent;color:rgba(255,255,255,.62);
  font-size:13px;font-weight:600;padding:9px 10px 8px;cursor:pointer;border-bottom:3px solid transparent;
  font-family:inherit;white-space:nowrap}
.tabs button[aria-selected=true]{color:#fff;border-bottom-color:#7fc4f5}

.nav{position:sticky;top:0;z-index:15;background:var(--bg);padding:10px 0 8px;display:flex;gap:8px}
.nav button{flex:0 0 44px;height:44px;border:1px solid var(--line);background:var(--card);
  border-radius:12px;font-size:19px;color:var(--brand);cursor:pointer;font-weight:600}
.nav button:disabled{opacity:.3}
.nav select{flex:1;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;
  font-size:16px;font-weight:700;color:var(--ink);text-align:center;text-align-last:center;
  padding:0 6px;appearance:none;cursor:pointer;font-family:inherit}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.card>h2{margin:0;padding:11px 14px;font-size:13px;font-weight:700;color:var(--sub);
  border-bottom:1px solid var(--line);background:#fafbfc}
.card .body{padding:12px 14px}

.hero{display:flex;align-items:center;gap:14px;padding:14px}
.hero .wx{font-size:40px;line-height:1}
.hero .d{flex:1;min-width:0}
.hero .d .day{font-size:20px;font-weight:800;letter-spacing:-.03em}
.hero .d .meta{font-size:12.5px;color:var(--sub);margin-top:2px}
.hero .t{text-align:right;font-size:12px;color:var(--sub);white-space:nowrap}
.hero .t b{display:block;font-size:17px;color:var(--ink);font-weight:700;letter-spacing:-.02em}

.pgrid{display:flex;gap:8px;margin-bottom:11px}
.pbox{flex:1;background:#f7f9fb;border-radius:10px;padding:9px 10px;min-width:0}
.pbox .lb{font-size:11px;color:var(--sub);white-space:nowrap}
.pbox .vl{font-size:19px;font-weight:800;letter-spacing:-.045em}
.bar{height:9px;background:#e6eaef;border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px}
.bar .plan{background:#b9c6d4}
.bar .act{background:var(--good);position:absolute;top:0;left:0}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--sub);margin-top:7px}
.legend s{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}

.grp{margin-bottom:13px}.grp:last-child{margin-bottom:0}
.grp>.gt{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:5px}
.sub{margin:0 0 7px}.sub:last-child{margin-bottom:0}
.sub .st{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;background:#6b7a8c;
  padding:1px 8px;border-radius:99px;margin-bottom:4px}
.sub .st.c1{background:#0b6ea9}.sub .st.c2{background:#7a5cc4}
.sub .st.c3{background:#0f9d58}.sub .st.c4{background:#c4622d}.sub .st.c5{background:#6b7a8c}
.sub ul{margin:0;padding-left:16px}.sub li{margin:1px 0}
.empty{color:#9aa6b4;font-size:13.5px}

.zone{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.zone:last-child{border-bottom:0;padding-bottom:0}
.zone .zn{flex:0 0 58px;font-size:12px;font-weight:700;color:#fff;background:var(--brand);
  border-radius:8px;height:24px;display:flex;align-items:center;justify-content:center}
.zone .ze{flex:1;font-size:13.5px}
.zone .zp{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;color:var(--sub);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.tot{display:flex;gap:8px;margin-bottom:10px}
.tot div{flex:1;background:#f7f9fb;border-radius:10px;padding:8px 11px}
.tot .lb{font-size:11.5px;color:var(--sub)}
.tot .vl{font-size:19px;font-weight:800;letter-spacing:-.03em}
.spec{color:var(--sub);font-size:11.5px}
.cat{padding:11px 0;border-bottom:1px solid var(--line)}
.cat:first-child{padding-top:0}.cat:last-child{border-bottom:0;padding-bottom:0}
.cat .ch{display:flex;align-items:baseline;gap:7px;margin-bottom:6px}
.cat .cn{font-size:14.5px;font-weight:700;letter-spacing:-.02em}
.cat .cu{font-size:11px;color:var(--sub);background:#eef1f5;padding:1px 6px;border-radius:99px}
.cat .cp{margin-left:auto;font-size:16px;font-weight:800;letter-spacing:-.04em}
.cat .cf{display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.cat .cf b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.cat details{margin-top:8px}
.cat summary{list-style:none;cursor:pointer;font-size:12px;color:var(--accent);font-weight:600}
.cat summary::-webkit-details-marker{display:none}
.cat details table{margin-top:6px;font-size:12.5px}
.cat details th,.cat details td{padding:4px 3px}

.doc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.doc>summary{padding:13px 14px;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center}
.doc>summary::-webkit-details-marker{display:none}
.doc>summary .dt{flex:0 0 auto;font-size:11.5px;font-weight:700;color:#fff;background:var(--accent);
  padding:2px 8px;border-radius:99px}
.doc>summary .dn{flex:1;font-size:14.5px;font-weight:700;letter-spacing:-.02em}
.doc>summary .ar{color:var(--sub);font-size:13px}
.doc[open]>summary{border-bottom:1px solid var(--line);background:#fafbfc}
.doc .md{padding:6px 14px 16px;font-size:14px;overflow-x:auto}
.doc .md h1,.doc .md h2,.doc .md h3{margin:16px 0 6px;letter-spacing:-.02em}
.doc .md h1{font-size:18px}.doc .md h2{font-size:16px}.doc .md h3{font-size:14.5px;color:var(--accent)}
.doc .md table{margin:8px 0;font-size:13px}
.doc .md th{background:#f7f9fb;border-bottom:1px solid var(--line);padding:6px}
.doc .md td{padding:6px}
.doc .md ul,.doc .md ol{padding-left:20px;margin:6px 0}
.doc .md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.doc .md blockquote{margin:8px 0;padding:2px 0 2px 12px;border-left:3px solid var(--line);color:var(--sub)}
.doc .md code{background:#f1f3f6;padding:1px 5px;border-radius:5px;font-size:12.5px}
.dl{display:block;padding:12px 14px;color:var(--accent);font-weight:600;text-decoration:none;font-size:14px}
.hint{background:#fff;border:1px dashed #c3cdd8;border-radius:14px;padding:22px 16px;text-align:center;color:var(--sub);font-size:13.5px}
.hint b{color:var(--ink);display:block;font-size:15px;margin-bottom:6px}
.hint code{background:#eef1f5;padding:2px 6px;border-radius:5px;font-size:12.5px;word-break:break-all}
footer{text-align:center;color:#9aa6b4;font-size:11.5px;padding:18px 0 6px}
.loading{text-align:center;padding:60px 0;color:var(--sub)}
</style>
</head>
<body>

<header><div class="inner">
  <h1 id="proj">공정 현황</h1>
  <div class="sub" id="gen"></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-t="daily"    aria-selected="true">일일공정</button>
    <button role="tab" data-t="weekly"   aria-selected="false">주간공정</button>
    <button role="tab" data-t="monthly"  aria-selected="false">월간공정</button>
    <button role="tab" data-t="contract" aria-selected="false">도급비산정</button>
  </div>
</div></header>

<div class="wrap">
  <div class="nav" id="nav" hidden>
    <button id="prev" aria-label="이전 날짜">&lsaquo;</button>
    <select id="pick"></select>
    <button id="next" aria-label="다음 날짜">&rsaquo;</button>
  </div>
  <div id="view" class="loading">불러오는 중…</div>
  <footer id="foot"></footer>
</div>

<script>
const WX={0:['☀️','맑음'],1:['🌤️','대체로 맑음'],2:['⛅','구름 조금'],3:['☁️','흐림'],
 45:['🌫️','안개'],48:['🌫️','짙은 안개'],51:['🌦️','약한 이슬비'],53:['🌦️','이슬비'],55:['🌦️','짙은 이슬비'],
 56:['🌧️','어는 이슬비'],57:['🌧️','어는 이슬비'],61:['🌦️','약한 비'],63:['🌧️','비'],65:['🌧️','강한 비'],
 66:['🌧️','어는 비'],67:['🌧️','어는 비'],71:['🌨️','약한 눈'],73:['❄️','눈'],75:['❄️','강한 눈'],77:['🌨️','싸락눈'],
 80:['🌦️','소나기'],81:['🌧️','소나기'],82:['⛈️','강한 소나기'],85:['🌨️','소낙눈'],86:['❄️','소낙눈'],
 95:['⛈️','뇌우'],96:['⛈️','뇌우·우박'],99:['⛈️','뇌우·우박']};
const TXT=[[/맑/,'☀️'],[/구름/,'⛅'],[/흐/,'☁️'],[/소나기/,'🌦️'],[/비/,'🌧️'],[/눈/,'❄️'],[/안개/,'🌫️']];
const DOW=['일','월','화','수','목','금','토'];
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const pct=v=>(v*100).toFixed(2)+'%';
function wx(d){
  if(d.wcode!=null&&WX[d.wcode]) return WX[d.wcode];
  for(const[re,ic]of TXT) if(re.test(d.weather||'')) return [ic,d.weather];
  return ['🌤️',d.weather||'-'];
}
let DATA=null,idx=0,tab='daily';

function workHtml(g){
  if(!g||!g.length) return '<div class="empty">등록된 내용 없음</div>';
  const c={'고색':'c1','곡반정':'c2','권선':'c3','공단':'c4','부대공':'c5'};
  return g.map(x=>`<div class="grp"><div class="gt">${esc(x.group)}</div>${
    x.subs.map(s=>`<div class="sub">${s.sub?`<span class="st ${c[s.sub]||''}">${esc(s.sub)}</span>`:''}
      <ul>${s.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></div>`).join('')}</div>`).join('');
}

const fmt=n=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:2});
const rp=r=>(r>0&&r<1?r.toFixed(2):r.toFixed(1))+'%';
function catHtml(cats){
  if(!cats||!cats.length) return '<div class="empty">집계 항목 없음</div>';
  const DF=DATA.catdefs;
  return cats.map((raw,ci)=>{
    const c = DF ? {name:DF[ci].name,unit:DF[ci].unit,design:DF[ci].design,
                    today:raw[0],cum:raw[1],
                    items:DF[ci].items.map((d,k)=>({name:d.name,unit:d.unit,design:d.design,
                                                    today:raw[2][k][0],cum:raw[2][k][1]}))} : raw;
    const r=c.design?c.cum/c.design*100:0;
    return `<div class="cat">
      <div class="ch"><span class="cn">${esc(c.name)}</span><span class="cu">${esc(c.unit)}</span>
        <span class="cp" style="color:${r>0?'var(--good)':'#9aa6b4'}">${rp(r)}</span></div>
      <div class="bar"><i class="act" style="width:${Math.min(100,r)}%${r>0?';min-width:4px':''}"></i></div>
      <div class="cf"><span>실적 <b>${fmt(c.today)}</b></span><span>누계 <b>${fmt(c.cum)}</b></span>
        <span>설계 <b>${fmt(c.design)}</b></span><span style="margin-left:auto">대비 <b>${rp(r)}</b></span></div>
      <details><summary>세부 ${c.items.length}개 항목 보기</summary>
        <table><thead><tr><th>항목</th><th class="n">실적</th><th class="n">누계</th><th class="n">설계</th></tr></thead>
        <tbody>${c.items.map(x=>`<tr><td>${esc(x.name)}<div class="spec">${esc(x.unit)}</div></td>
          <td class="n">${fmt(x.today)}</td><td class="n">${fmt(x.cum)}</td><td class="n">${fmt(x.design)}</td></tr>`).join('')}
        </tbody></table></details>
    </div>`;}).join('');
}
function daily(){
  const d=DATA.days[idx],dt=new Date(d.date+'T00:00:00'),p=d.progress;
  const w=wx(d), ic=w[0], wname=w[1];
  const hasAct=p.cum_act>0;
  const ratio=hasAct&&p.cum_plan?p.cum_act/p.cum_plan:0;
  const zones=d.zones.filter(z=>z.equip||z.people);
  const eq=d.equip.map(e=>`<tr><td>${esc(e.name)}<div class="spec">${esc(e.spec)}</div></td>
      <td class="n">${e.today}</td><td class="n">${e.cum}</td></tr>`).join('');
  const cr=d.crew.map(c=>`<tr><td>${esc(c.name)}</td><td class="n">${c.today}</td><td class="n">${c.cum}</td></tr>`).join('');
  return `
  <div class="card"><div class="hero">
    <div class="wx">${ic}</div>
    <div class="d"><div class="day">${dt.getMonth()+1}월 ${dt.getDate()}일 (${DOW[dt.getDay()]})</div>
      <div class="meta">${esc(wname)} · 수원시</div></div>
    <div class="t">최저 / 최고<b>${d.tmin??'-'}° / ${d.tmax??'-'}°</b></div>
  </div></div>

  <div class="card"><h2>공정률</h2><div class="body">
    <div class="pgrid">
      <div class="pbox"><div class="lb">계획누계</div><div class="vl">${pct(p.cum_plan)}</div></div>
      <div class="pbox"><div class="lb">실적누계</div><div class="vl" style="color:${hasAct?'var(--good)':'#9aa6b4'}">${hasAct?pct(p.cum_act):'미입력'}</div></div>
      <div class="pbox"><div class="lb">대비</div><div class="vl" style="color:${hasAct?(ratio>=1?'var(--good)':'var(--bad)'):'#9aa6b4'}">${hasAct?pct(ratio):'-'}</div></div>
    </div>
    <div class="bar"><i class="plan" style="width:${Math.min(100,p.cum_plan*100)}%"></i><i class="act" style="width:${Math.min(100,p.cum_act*100)}%"></i></div>
    <div class="legend"><span><s style="background:#b9c6d4"></s>계획</span><span><s style="background:var(--good)"></s>실적</span>
      <span style="margin-left:auto">일 계획 ${pct(p.day_plan)}</span></div>
  </div></div>

  <div class="card"><h2>금일 작업</h2><div class="body">${workHtml(d.today)}</div></div>
  <div class="card"><h2>명일 작업</h2><div class="body">${workHtml(d.tomorrow)}</div></div>

  <div class="card"><h2>공종별 진척 (실적 · 누계 · 대비)</h2><div class="body">${catHtml(d.cats)}</div></div>

  <div class="card"><h2>투입 장비 · 인력</h2><div class="body">
    <div class="tot">
      <div><div class="lb">금일 장비</div><div class="vl">${d.equip_total.today}<span style="font-size:12px;font-weight:600"> 대</span></div></div>
      <div><div class="lb">금일 인력</div><div class="vl">${d.crew_total.today}<span style="font-size:12px;font-weight:600"> 명</span></div></div>
    </div>
    ${zones.length?`<div style="margin-bottom:12px">${zones.map(z=>`<div class="zone">
      <div class="zn">${esc(z.zone)}</div><div class="ze">${esc(z.equip||'-')}</div>
      <div class="zp">${z.people?z.people+'명':''}</div></div>`).join('')}</div>`:''}
    ${eq?`<table><thead><tr><th>장비</th><th class="n">금일</th><th class="n">누계</th></tr></thead><tbody>${eq}</tbody></table>`:'<div class="empty">금일 투입 장비 없음</div>'}
    ${cr?`<table style="margin-top:12px"><thead><tr><th>직종</th><th class="n">금일</th><th class="n">누계</th></tr></thead><tbody>${cr}</tbody></table>`:'<div class="empty" style="margin-top:10px">금일 투입 인력 없음</div>'}
  </div></div>`;
}

function docs(key,label,folder){
  const list=DATA[key]||[];
  if(!list.length) return `<div class="hint"><b>등록된 ${label} 문서가 없습니다</b>
    작업일보 폴더의 <code>docs\\${folder}</code> 안에<br>파일을 넣고 갱신하면 여기에 표시됩니다.<br><br>
    <span style="font-size:12.5px">md · html · txt 는 본문이 그대로 보이고,<br>pdf · xlsx · hwp 등은 내려받기 링크로 표시됩니다.</span></div>`;
  return list.map((d,i)=>`<details class="doc" ${i===0?'open':''}>
    <summary><span class="dt">${esc(d.date||'')}</span><span class="dn">${esc(d.title)}</span><span class="ar">▾</span></summary>
    ${d.html?`<div class="md">${d.html}</div>`:`<a class="dl" href="${esc(d.file)}" target="_blank" rel="noopener">📎 ${esc(d.filename)} 열기</a>`}
  </details>`).join('');
}

function render(){
  const v=document.getElementById('view'),nav=document.getElementById('nav');
  v.className='';
  nav.hidden = tab!=='daily';
  if(tab==='daily'){ v.innerHTML=daily(); document.getElementById('pick').value=idx;
    document.getElementById('prev').disabled=idx>=DATA.days.length-1;
    document.getElementById('next').disabled=idx<=0; }
  else if(tab==='weekly')   v.innerHTML=docs('weekly','주간공정','주간공정');
  else if(tab==='monthly')  v.innerHTML=docs('monthly','월간공정','월간공정');
  else                      v.innerHTML=docs('contract','도급비산정','도급비산정');
  window.scrollTo({top:0});
}
function move(n){const i=idx+n;if(i>=0&&i<DATA.days.length){idx=i;render();}}

(function(j){
  DATA=j;
  document.getElementById('proj').textContent=j.project;
  document.getElementById('gen').textContent='최종 갱신 '+j.generated;
  document.getElementById('foot').textContent='작업일보 '+j.days.length+'일치 · '+j.days[j.days.length-1].date+' ~ '+j.days[0].date;
  const sel=document.getElementById('pick');
  sel.innerHTML=j.days.map((d,i)=>{const dt=new Date(d.date+'T00:00:00');
    return `<option value="${i}">${d.date.slice(2).replace(/-/g,'.')} (${DOW[dt.getDay()]})</option>`;}).join('');
  sel.onchange=e=>{idx=+e.target.value;render();};
  document.getElementById('prev').onclick=()=>move(1);
  document.getElementById('next').onclick=()=>move(-1);
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
    tab=b.dataset.t;
